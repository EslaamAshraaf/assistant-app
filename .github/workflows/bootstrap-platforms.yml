name: Bootstrap platform scaffolding

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.50.1
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.50.1 --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Regenerate Android and iOS folders
        run: |
          flutter config --no-analytics
          flutter --version
          flutter create . --org com.assistant --project-name assistant_app --platforms android,ios

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          git diff --cached --quiet || git commit -m "Add generated Android and iOS platform scaffolding (Flutter 3.50.1)"
          git push
